<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <!-- Importar fuentes bonitas desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #e1bee7);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Contenedor principal de las tarjetas */
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        /* Tarjeta de bienvenida */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .card h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.8rem;
            color: #d81b60;
            margin-bottom: 10px;
        }

        .card p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Botón bonito */
        .btn-surprise {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-surprise:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.6);
        }

        .btn-surprise:active {
            transform: translateY(0);
        }

        /* Contenedor del video (inicialmente oculto) */
        .video-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .video-container.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        video {
            width: 100%;
            border-radius: 12px;
            outline: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
            position: absolute;
        }

        /* Botón para regresar */
        .btn-back {
            background: transparent;
            border: 2px solid #ddd;
            color: #777;
            padding: 8px 20px;
            font-size: 0.9rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .btn-back:hover {
            border-color: #e91e63;
            color: #e91e63;
        }

        /* Fondo animado con corazones flotantes */
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.5);
            bottom: -30px;
            transform: rotate(45deg);
            animation: floatUp 8s linear infinite;
        }

        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }

        .heart::before { top: -10px; left: 0; }
        .heart::after { top: 0; left: -10px; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(45deg) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(45deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo de corazones flotantes -->
    <div class="hearts" id="hearts"></div>

    <div class="container">
        <!-- Pantalla Inicial -->
        <div class="card" id="welcomeCard">
            <h1>Feliz Cumpleaños</h1>
            <p>Esto es un regalo especial, con mucho cariño</p>
            <button class="btn-surprise" onclick="mostrarVideo()">Abrir sorpresa ✨</button>
        </div>

        <!-- Pantalla del Video -->
        <div class="video-container" id="videoContainer">
            <!-- Cambia "tu-video.mp4" por la ruta o nombre de tu video -->
            <video id="myVideo" controls>
                <source src="img/fabiola-definitio_rlHJ3qED.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
            <br>
            <button class="btn-back" onclick="cerrarVideo()">Volver</button>
        </div>
    </div>

    <script>
        // Función para cambiar de la tarjeta al video de forma fluida
        function mostrarVideo() {
            const card = document.getElementById('welcomeCard');
            const videoContainer = document.getElementById('videoContainer');
            const video = document.getElementById('myVideo');

            card.classList.add('hidden');
            videoContainer.classList.add('active');
            
            // Reproducir el video automáticamente al abrir (opcional)
            video.play().catch(error => {
                console.log("Autoplay bloqueado por el navegador:", error);
            });
        }

        // Función para regresar y pausar el video
        function cerrarVideo() {
            const card = document.getElementById('welcomeCard');
            const videoContainer = document.getElementById('videoContainer');
            const video = document.getElementById('myVideo');

            video.pause();
            video.currentTime = 0; // Reinicia el video

            videoContainer.classList.remove('active');
            card.classList.remove('hidden');
        }

        // Generar corazones flotantes automáticamente en el fondo
        function crearCorazones() {
            const heartsContainer = document.getElementById('hearts');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // Posición y velocidad aleatoria
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            
            heartsContainer.appendChild(heart);

            // Eliminar el corazón cuando termine la animación
            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        // Crear un corazón cada 400 milisegundos
        setInterval(crearCorazones, 400);
    </script>

</body>
</html>
